<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6efec">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="查理的記帳APP">
<title>查理的記帳APP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'GenSenRound';src:url('https://cdn.jsdelivr.net/gh/max32002/GenSenRounded-webfont@1.0/webfont/GenSenRounded-TC/GenSenRoundedTC-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'GenSenRound';src:url('https://cdn.jsdelivr.net/gh/max32002/GenSenRounded-webfont@1.0/webfont/GenSenRounded-TC/GenSenRoundedTC-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{
  --bg:#fff7e8; --ink:#2a1a2e; --sub:#9a8478; --line:rgba(42,26,46,.1);
  --coral:#ff6a3e; --coral2:#ff8c42; --coral3:#ffa55e;
  --green:#5a8a4e; --red:#b0553a;
  --card:#ffffff; --cardgrad:#ffffff;
  --herograd:linear-gradient(135deg,#ff8c42,#ff5e7e);
  --inkline:#2a1a2e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;overflow-x:hidden}
input,select,textarea{max-width:100%}
body{font-family:'GenSenRound','Outfit',sans-serif;background:var(--bg);color:var(--ink);
  display:flex;justify-content:center}
.num,.amt{font-family:'Outfit',sans-serif}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);background-image:radial-gradient(rgba(255,140,60,.1) 1.5px,transparent 1.5px);background-size:15px 15px;overflow:hidden}

/* 固定頂列 */
.topbar{flex-shrink:0;padding:max(14px,env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);z-index:5}
.topbar .title{font-size:22px;font-weight:700}
.topbar .gear,.topbar .back{width:38px;height:38px;border-radius:12px;background:rgba(58,44,42,.07);display:flex;align-items:center;justify-content:center;cursor:pointer}
.topbar .gear svg,.topbar .back svg{width:20px;height:20px;stroke:var(--ink)}
.topbar .addchip{display:flex;align-items:center;gap:5px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:8px 14px;border-radius:20px;cursor:pointer}
.topbar .addchip svg{width:15px;height:15px;stroke:var(--bg)}

/* 中間捲動區 */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 18px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}

/* 固定底部 Tab */
.tabbar{flex-shrink:0;display:flex;justify-content:space-around;align-items:center;padding:10px 8px max(22px,env(safe-area-inset-bottom));background:var(--bg);border-top:2.5px solid var(--ink);position:relative;z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;opacity:.34;cursor:pointer;border:none;background:none;color:var(--ink);font-family:inherit}
.tab.on{opacity:1;color:var(--coral)}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none}
.addbtn{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--coral2),var(--coral));display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--inkline);margin-top:-20px;cursor:pointer;border:2.5px solid var(--inkline);position:relative;z-index:7;color:#fff}
.addbtn svg{width:26px;height:26px;stroke:#fff;fill:none}

/* 卡片 */
.card{background:var(--card);box-shadow:4px 4px 0 var(--inkline);border:2.5px solid var(--inkline);border-radius:18px;padding:18px;margin-bottom:14px}
.card h3{font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--sub);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}

/* 淨資產主卡 */
.hero{background:var(--herograd);color:#fff;border:2.5px solid var(--inkline);border-radius:22px;padding:24px 22px;margin-bottom:14px;box-shadow:5px 5px 0 var(--inkline);position:relative;overflow:hidden}
.hero .label{font-size:13px;font-weight:700;letter-spacing:.5px;color:rgba(255,255,255,.85)}
.hero .big{font-size:44px;font-weight:700;letter-spacing:-1px;margin-top:8px;line-height:1.05;color:#fff;font-family:'Outfit'}
.hero .sub{display:flex;gap:12px;margin-top:14px;font-size:12px;font-weight:700}
.hero .sub span{padding:5px 11px;border-radius:20px}
.hero .sub .up{background:linear-gradient(135deg,#8fb89a,#6f8a6a);color:#1e2e22}
.hero .sub .loan{background:rgba(255,255,255,.1);color:#d9c4bd}
.trend{height:64px;margin-top:14px;position:relative}
.trend svg{width:100%;height:100%}

/* 5 格 */
.grid5{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbox{background:rgba(58,44,42,.05);border-radius:13px;padding:11px 12px;cursor:pointer}
.mbox:first-child{grid-column:1/3;background:linear-gradient(135deg,rgba(210,122,98,.13),rgba(210,122,98,.04))}
.mbox .l{font-size:12px;color:var(--sub);font-weight:700}
.mbox .v{font-size:20px;font-family:'Outfit';font-weight:700;margin-top:3px;color:var(--coral)}

/* 列表通用 */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border:none}
.lrow .ico{width:42px;height:42px;border-radius:11px;background:#fff7e8;border:2px solid var(--inkline);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.lrow .nm{flex:1;font-weight:700;font-size:15px}
.lrow .nm small{display:block;font-size:11px;color:var(--sub);font-weight:500;margin-top:1px}
.lrow .amt{font-weight:700;font-size:16px;font-family:'Outfit'}
.green{color:var(--green)}.red{color:var(--red)}
.mbox .v.green{color:var(--green)}.mbox .v.red{color:var(--red)}
.bar{height:7px;border-radius:6px;background:#dde2d4;overflow:hidden;margin:7px 0 3px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--coral2),var(--coral3))}

/* 記帳本 */
.calwrap{margin-bottom:11px}
.calhead{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700;margin-bottom:10px}
.calhead button{border:none;background:rgba(58,44,42,.07);width:32px;height:32px;border-radius:9px;font-size:16px;cursor:pointer;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{font-size:10px;color:var(--sub);text-align:center;padding:3px 0;font-weight:700}
.cal .d{aspect-ratio:1;background:rgba(58,44,42,.04);border-radius:8px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);position:relative;cursor:pointer;font-family:'Outfit';font-weight:600}
.cal .d.mute{opacity:.28}
.cal .d.today{outline:2px solid var(--coral3)}
.cal .d.act{background:var(--coral);color:#fff}
.cal .d.dot::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--coral2);position:absolute;bottom:5px}
.cal .d.act.dot::after{background:#fff}
.summary{display:flex;gap:8px;margin-bottom:11px}
.summary.compact{gap:6px;margin-bottom:8px}
.summary.compact .sbox{padding:5px 6px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.summary.compact .sbox .l{font-size:10px}
.summary.compact .sbox .v{font-size:13px;margin-top:0}
.sbox{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.sbox .l{font-size:11px;color:var(--sub);font-weight:700}
.sbox .v{font-size:17px;font-family:'Outfit';font-weight:700;margin-top:3px}
.reclabel{font-size:12px;color:var(--sub);font-weight:700;margin:2px 2px 8px;display:flex;justify-content:space-between}
.reclist{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px;min-height:120px}
/* 記帳本：整頁不捲，記錄區填滿剩餘高度並內部捲動（拉感） */
#app.bookmode .scroll{overflow:hidden;display:flex;flex-direction:column}
#app.bookmode #page-book{display:flex;flex-direction:column;flex:1;min-height:0}
#app.bookmode #page-book .reclist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* 分頁籤 */
.segtab{display:flex;background:rgba(58,44,42,.07);border-radius:12px;padding:3px;margin-bottom:13px}
.segtab button{flex:1;border:none;background:none;font-family:inherit;font-size:14px;font-weight:700;padding:9px;border-radius:9px;color:var(--sub);cursor:pointer}
.segtab button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* 設定列 */
.setrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px;font-size:15px;font-weight:700;cursor:pointer}
.setrow .e{font-size:19px}.setrow .ar{margin-left:auto;color:#b0a09a;font-size:18px}

/* 全頁彈窗 */
.modal{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;opacity:0;transition:opacity .15s ease;visibility:hidden}
.modal.show{opacity:1;visibility:visible}
.mtop{flex-shrink:0;padding:max(16px,env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between}
.mtop .x{font-size:24px;color:#b0a09a;cursor:pointer;background:none;border:none;width:30px}
.mtop .t{font-size:18px;font-weight:700}
.mtop .save{font-size:15px;font-weight:700;color:var(--coral);cursor:pointer;background:none;border:none;font-family:inherit}
.mscroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 18px 30px;scrollbar-width:none}
.mscroll::-webkit-scrollbar{display:none}
.field{margin-bottom:16px}
.field label{font-size:13px;font-weight:700;color:var(--sub);display:block;margin-bottom:7px}
.inp{width:100%;background:rgba(255,255,255,.85);border:1.5px solid rgba(58,44,42,.15);border-radius:12px;padding:13px 14px;font-size:15px;font-family:inherit;font-weight:700;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--coral3)}
select.inp{appearance:none}
.seg2{display:flex;background:rgba(58,44,42,.07);border-radius:11px;padding:3px}
.seg2 button{flex:1;border:none;background:none;font-family:inherit;font-size:14px;font-weight:700;padding:10px;border-radius:9px;color:var(--sub);cursor:pointer}
.seg2 button.on{background:#fff;color:var(--ink)}
.emojigrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.emojigrid span{aspect-ratio:1;background:rgba(255,255,255,.7);border:1.5px solid transparent;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.emojigrid span.sel{border-color:var(--coral);background:#eef2e4}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;position:relative}
.cbox .e{font-size:25px}.cbox .t{font-size:12px;font-weight:700;text-align:center}
.cbox.add{background:linear-gradient(135deg,var(--coral3),var(--coral2));border:none;color:#fff}
.bigbtn{width:100%;background:var(--ink);color:var(--bg);border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:6px}
.btn-danger{background:none;color:var(--red);border:1.5px solid var(--red);margin-top:10px}

/* keypad */
.txnbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:0;scrollbar-width:none;min-height:0}
.txnbody::-webkit-scrollbar{display:none}
/* Moze 風緊湊單行欄位 */
.trow{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:relative}
.trow select.tv{position:absolute;inset:0;width:100%;max-width:none;opacity:0;cursor:pointer}
.trow .selval{margin-left:auto;font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;pointer-events:none}
.trow .selval .ar{color:#b0a09a;font-size:16px}
.trow .ti{width:24px;text-align:center;font-size:17px;flex-shrink:0}
.trow .tl{font-size:16px;font-weight:700;color:var(--ink)}
.trow .tv{margin-left:auto;font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.trow .tv.ph{color:var(--sub);font-weight:500}
.trow .tv .ar{color:#b0a09a;font-size:16px}
.trow input.tv{border:none;background:none;font-family:inherit;text-align:right;width:60%;margin-left:auto;font-size:15px;font-weight:700;color:var(--ink)}
.trow input.tv:focus{outline:none}
.amtbig{font-size:28px;font-family:'Outfit';font-weight:700;color:var(--coral);text-align:right}
.notebox{width:100%;border:none;background:none;font-family:inherit;font-size:14px;padding:8px 18px;color:var(--ink);resize:none}
.notebox:focus{outline:none}
/* 鍵盤：莫蘭迪夢幻漸層 */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px 14px max(12px,env(safe-area-inset-bottom));background:linear-gradient(180deg,#e6ebdf,#dde3d3);border-top:1px solid rgba(176,138,58,.15);flex-shrink:0}
.kp button{background:linear-gradient(160deg,#f8faf2,#eef2e6);border:1px solid rgba(176,138,58,.12);border-radius:14px;padding:13px;font-size:20px;font-weight:700;font-family:'Outfit';cursor:pointer;color:#4a5238;box-shadow:0 2px 6px rgba(176,138,58,.08),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .06s}
.kp button:active{transform:scale(.94);background:linear-gradient(160deg,#e8efe0,#dde6d0)}
/* 教學模擬畫面 */
.mockwrap{display:flex;justify-content:center;padding:8px 22px}
.mock{width:230px;background:#f6efec;border:6px solid #2e211d;border-radius:26px;padding:12px 10px;display:flex;flex-direction:column;gap:7px;box-shadow:0 10px 30px rgba(58,44,42,.2)}
.mock .mhero{background:linear-gradient(150deg,#2d352a,#1a1f16);border-radius:14px;padding:12px;color:#fff}
.mock .ml{font-size:9px;color:rgba(255,255,255,.85);font-weight:700}
.mock .mbig{font-size:20px;font-weight:700;font-family:'Outfit';color:#fff}
.mock .mup{font-size:9px;color:#e8b4a0;margin-top:3px}
.mock .mcard,.mock .mcardh{font-size:10px}
.mock .mcardh{font-weight:700;color:var(--sub);margin-top:4px}
.mock .mgrid{display:flex;flex-wrap:wrap;gap:4px}
.mock .mg{background:rgba(192,107,84,.1);border-radius:7px;padding:6px 8px;font-size:10px;font-weight:700;flex:1;white-space:nowrap}
.mock .mg.full{flex-basis:100%}
.mock .mseg{display:flex;background:rgba(58,44,42,.07);border-radius:8px;padding:2px;font-size:10px;font-weight:700}
.mock .mseg span{flex:1;text-align:center;padding:5px;border-radius:6px;color:var(--sub)}
.mock .mseg span.on{background:#fff;color:var(--ink)}
.mock .mrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;padding:6px 4px;border-bottom:1px solid rgba(58,44,42,.06)}
.mock .mmeta{font-size:9px;color:var(--sub);padding:1px 4px}
.mock .mbar{height:6px;background:#dde2d4;border-radius:4px;overflow:hidden;margin:3px 4px}
.mock .mbar i{display:block;height:100%;background:linear-gradient(90deg,#d27a62,#e29a82)}
.mock .mkp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px}
.mock .mkp i{background:linear-gradient(160deg,#f8faf2,#eef2e6);border:1px solid rgba(176,138,58,.12);border-radius:8px;padding:7px;text-align:center;font-size:13px;font-weight:700;font-family:'Outfit';color:#4a5238;font-style:normal}
.mock .mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mock .mcal i{aspect-ratio:1;background:rgba(58,44,42,.05);border-radius:5px;font-size:9px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;position:relative}
.mock .mcal i.on{background:#c06b54;color:#fff}
.mock .mcal i.dot::after{content:'';width:3px;height:3px;border-radius:50%;background:#d27a62;position:absolute;bottom:2px}
.mock .msum{display:flex;gap:5px}
.mock .msum span{flex:1;text-align:center;background:rgba(255,255,255,.6);border-radius:7px;padding:5px;font-size:10px;font-weight:700;font-family:'Outfit'}
.mock .mdonut{width:70px;height:70px;border-radius:50%;margin:6px auto;background:conic-gradient(#c06b54 0 42%,#d27a62 42% 60%,#e29a82 60% 78%,#8aa3c4 78% 100%)}
.tstep{display:flex;gap:11px;align-items:flex-start;margin-bottom:11px;font-size:14px;line-height:1.6}
.tnum{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--coral);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Outfit'}
.amtdisplay{font-size:42px;font-family:'Outfit';font-weight:700;text-align:right;padding:6px 4px 14px;color:var(--coral)}
.picker{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.85);border:1.5px solid rgba(58,44,42,.15);border-radius:12px;padding:13px 14px;font-size:15px;font-weight:700;cursor:pointer}
.picker .ar{color:#b0a09a;font-size:18px}

/* loading / toast */
.loading{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:99}
.spinner{width:38px;height:38px;border:3px solid rgba(192,107,84,.2);border-top-color:var(--coral);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:22px;font-size:14px;font-weight:700;z-index:90;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:30px 0}
.page{display:none}.page.on{display:block}
.donut{width:120px;height:120px;margin:0 auto}
/* 啟動畫面 splash（像微信進入） */
#splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#c0392b 0%,#a02718 60%,#7d1c10 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease;gap:22px}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo{width:128px;height:128px;border-radius:30px;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:splashpop .6s cubic-bezier(.34,1.4,.5,1)}
#splash .title{color:#f8e8c8;font-size:24px;font-weight:700;letter-spacing:2px;animation:splashfade .8s ease .2s both}
#splash .foot{position:absolute;bottom:max(46px,env(safe-area-inset-bottom));color:rgba(248,232,200,.6);font-size:13px;font-weight:500;animation:splashfade .8s ease .4s both}
@keyframes splashpop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes splashfade{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loading"><div class="spinner"></div><div style="color:var(--sub);font-size:13px;font-weight:700">載入中…</div></div>

  <!-- 頂列 -->
  <div class="topbar">
    <div class="title" id="topTitle">主頁</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="addchip" id="topAdd" style="display:none" onclick="onTopAdd()"><svg viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round" fill="none"><path d="M12 5v14M5 12h14"/></svg>新增</div>
      <div class="gear" onclick="openStats()"><svg viewBox="0 0 24 24" stroke-width="2" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>

<div id="splash">
  <img class="logo" src="icon-192.png" alt="">

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzishhFaJF9zQHkxt35VEZ9fahfDkOxa6TX2EcYuk0iaKzqyRzIaMyo9cPdNWCa9ET8Fg/exec';

let DB = null;             // 全部資料
let curPage = 'home';
let bookDate = todayStr(); // 記帳本選定日期
let calYear, calMonth;     // 月曆顯示年月

// ---------- 工具 ----------
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dkey(v){ // 把任何日期字串正規化成 yyyy-MM-dd
  let s=String(v||'').trim();
  let m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  return s.slice(0,10);
}
function fmt(n){ n=Number(n)||0; return n.toLocaleString('en-US',{maximumFractionDigits:0}); }
function fmtSign(n){ n=Number(n)||0; return (n>=0?'+':'')+fmt(n); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- API ----------
async function apiGet(action){
  const r = await fetch(API_URL+'?action='+action);
  return await r.json();
}
let _posting = false;
async function apiPost(action, extra){
  if(_posting){ return {ok:false, error:'busy'}; } // 防連點/重送
  _posting = true;
  try{
    const r = await fetch(API_URL, {
      method:'POST',
      redirect:'follow',
      body: JSON.stringify(Object.assign({action}, extra)),
      headers:{'Content-Type':'text/plain;charset=utf-8'} // 避免 CORS preflight
    });
    return await r.json();
  } finally {
    _posting = false;
  }
}

async function loadAll(){
  const res = await apiGet('all');
  if(res.ok){ DB = res.data; renderAll(); }
  else { toast('載入失敗'); console.error(res.error); }
  document.getElementById('loading').style.display='none';
}

// ---------- emoji 庫（70+） ----------
const EMOJIS = ['🍽️','🍜','🍱','🍔','🍕','🍰','🍹','☕','🛒','🛍️','👕','👟','💄','🧴','🚆','🚗','🚕','⛽','✈️','🚲','🅿️','🏠','🏡','🏘️','💡','📺','🛋️','🔧','📱','💻','📞','📶','🎮','🎬','🎤','💊','🦷','🏥','💉','🧘','💆','🏆','📖','🎓','📚','✏️','💼','📄','⚖️','💰','💵','💸','💳','🏦','🪙','📈','🎁','🧧','🎉','🐶','🐱','🌳','🌸','🍑','🚬','💎','👶','🎵','⭐','☂️','⚽'];

// ---------- 計算 ----------
function totals(){
  let cash=0, investCash=0, accLoan=0;
  DB.accounts.forEach(a=>{
    if(String(a.archived)==='true'||a.archived===true) return;
    if(String(a.exclude)==='true'||a.exclude===true) return;
    const bal=Number(a.balance)||0, ty=a.type;
    if(ty==='cash'||ty==='bank') cash+=bal;
    else if(ty==='broker'||ty==='wealth') investCash+=bal;
    else if(ty==='credit'||ty==='borrow') accLoan+=Math.abs(bal);
    else if(ty==='lend') cash+=bal;
    else cash+=bal;
  });
  let stock=0,etf=0,fund=0,cost=0;
  DB.holdings.forEach(h=>{ if(h.type==='stock')stock+=h.marketValue; else if(h.type==='etf')etf+=h.marketValue; else if(h.type==='fund')fund+=h.marketValue; cost+=h.costValue; });
  let loan=accLoan; DB.loans.forEach(l=>{ if(String(l.active)!=='false') loan+=Number(l.remainingBalance)||0; });
  const holdingValue=stock+etf+fund;
  const invest=holdingValue+investCash;   // 投資含證券/理財閒置現金
  return {cash,investCash,stock,etf,fund,invest,holdingValue,cost,loan,assets:cash+invest,pl:holdingValue-cost};
}
function monthTotals(ym){ // ym='2026-06'
  let inc=0,exp=0;
  DB.transactions.forEach(t=>{ if(dkey(t.date).slice(0,7)===ym){ if(t.type==='income')inc+=Number(t.amount)||0; else if(t.type==='expense')exp+=Number(t.amount)||0; } });
  return {inc,exp,net:inc-exp};
}
function dayTotals(d){
  let inc=0,exp=0;
  DB.transactions.forEach(t=>{ if(dkey(t.date)===d){ if(t.type==='income')inc+=Number(t.amount)||0; else if(t.type==='expense')exp+=Number(t.amount)||0; } });
  return {inc,exp,net:inc-exp};
}
function catMap(){ const m={}; DB.categories.forEach(c=>m[c.category_id]=c); return m; }
function accMap(){ const m={}; DB.accounts.forEach(a=>m[a.account_id]=a); return m; }

// ---------- 渲染：全部 ----------
function renderAll(){ renderHome(); renderBook(); renderBank(); renderInvest(); }

// 主頁
function renderHome(){
  const t=totals();
  const ym=todayStr().slice(0,7);
  const mt=monthTotals(ym);
  const snaps=DB.snapshots.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  // 趨勢 sparkline
  let spark='';
  if(snaps.length>1){
    const vals=snaps.map(s=>Number(s.total_assets)||0);
    const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
    const pts=vals.map((v,i)=>{ const x=i/(vals.length-1)*100; const y=58-((v-min)/rng*52); return x.toFixed(1)+','+y.toFixed(1); }).join(' ');
    spark=`<svg viewBox="0 0 100 64" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#e29a82" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  } else spark='<div style="color:#7a6258;font-size:11px;text-align:center;padding-top:22px">資料累積中，明天起顯示趨勢</div>';

  // 月增減%
  let chg='—';
  if(snaps.length>1){ const a=Number(snaps[snaps.length-2].total_assets)||0, b=Number(snaps[snaps.length-1].total_assets)||0; if(a>0)chg=((b-a)/a*100).toFixed(1)+'%'; }

  let loansHtml = DB.loans.filter(l=>String(l.active)!=='false').map(l=>`
    <div class="lrow"><div class="ico">${l.icon||'💳'}</div>
      <div class="nm">${esc(l.name)}<small>利率 ${l.rate}% · 月繳 ${fmt(l.monthlyPayment)} · 剩 ${l.remainingMonths} 期</small></div>
      <div class="amt red">${fmt(l.remainingBalance)}</div></div>`).join('') || '<div class="empty">無貸款</div>';

  document.getElementById('page-home').innerHTML=`
    <div class="hero">
      <div class="label">淨資產 Net Worth</div>
      <div class="big">$${fmt(t.assets)}</div>
      <div class="sub"><span class="up">↑ ${chg} 本月</span></div>
      <div class="trend">${spark}</div>
    </div>
    <div class="card"><h3>資產總覽</h3>
      <div class="grid5">
        <div class="mbox"><div class="l">總資產</div><div class="v green">${fmt(t.assets)}</div></div>
        <div class="mbox" onclick="switchPage('bank')"><div class="l">總存款</div><div class="v green">${fmt(t.cash)}</div></div>
        <div class="mbox" onclick="switchPage('invest')"><div class="l">股票</div><div class="v green">${fmt(t.stock)}</div></div>
        <div class="mbox" onclick="switchPage('invest')"><div class="l">ETF</div><div class="v green">${fmt(t.etf)}</div></div>
        <div class="mbox" onclick="switchPage('invest')"><div class="l">基金</div><div class="v green">${fmt(t.fund)}</div></div>
      </div>
    </div>
    <div class="card"><h3>貸款餘額 <span class="red">${fmt(t.loan)}</span></h3>${loansHtml}</div>
    <div class="card"><h3>本月收支</h3>
      <div class="summary" style="margin:0">
        <div class="sbox"><div class="l">收入</div><div class="v green">${fmtSign(mt.inc)}</div></div>
        <div class="sbox"><div class="l">支出</div><div class="v red">−${fmt(mt.exp)}</div></div>
        <div class="sbox"><div class="l">結餘</div><div class="v ${mt.net>=0?'green':'red'}">${fmtSign(mt.net)}</div></div>
      </div>
    </div>`;
}

// 記帳本
function renderBook(){
  const cm=catMap();
  const d=new Date(bookDate); if(calYear==null){ calYear=d.getFullYear(); calMonth=d.getMonth(); }
  const ds=dayTotals(bookDate);
  // 月曆
  const first=new Date(calYear,calMonth,1); const startW=first.getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const recDates={}; DB.transactions.forEach(t=>{ recDates[dkey(t.date)]=true; });
  let cells='';
  for(let i=0;i<42;i++){
    let dd,cls='d',ymd;
    if(i<startW){ dd=prevDays-startW+1+i; cls+=' mute'; const m=calMonth-1; ymd=cellYmd(calYear,m,dd); }
    else if(i<startW+daysInMonth){ dd=i-startW+1; ymd=cellYmd(calYear,calMonth,dd);
      if(ymd===todayStr())cls+=' today'; if(ymd===bookDate)cls+=' act'; if(recDates[ymd])cls+=' dot'; }
    else { dd=i-startW-daysInMonth+1; cls+=' mute'; ymd=cellYmd(calYear,calMonth+1,dd); }
    cells+=`<div class="${cls}" onclick="pickDate('${ymd}')">${dd}</div>`;
    if(i>=startW+daysInMonth && (i-startW-daysInMonth+1)>=7 && i%7===6) {} // 不提早結束，固定 6 列
  }
  // 當日記錄
  const recs=DB.transactions.filter(t=>dkey(t.date)===bookDate).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  let recHtml=recs.map(t=>{
    const c=cm[t.category_id]||{}; const isInc=t.type==='income';
    return `<div class="lrow" onclick="openEditTxn('${t.txn_id}')"><div class="ico">${c.icon||(isInc?'💰':'💸')}</div>
      <div class="nm">${esc(c.name||t.note||'未分類')}<small>${esc(t.note||'')}</small></div>
      <div class="amt ${isInc?'green':'red'}">${isInc?'+':'−'}${fmt(t.amount)}</div></div>`;
  }).join('') || '<div class="empty">這天還沒有記錄</div>';

  document.getElementById('page-book').innerHTML=`
    <div class="card calwrap">
      <div class="calhead"><button onclick="calNav(-1)">‹</button><span>${calYear} 年 ${calMonth+1} 月</span><button onclick="calNav(1)">›</button></div>
      <div class="cal">
        <div class="h">日</div><div class="h">一</div><div class="h">二</div><div class="h">三</div><div class="h">四</div><div class="h">五</div><div class="h">六</div>
        ${cells}
      </div>
    </div>
    <div class="summary compact">
      <div class="sbox"><div class="l">收入</div><div class="v green">${fmtSign(ds.inc)}</div></div>
      <div class="sbox"><div class="l">支出</div><div class="v red">${ds.exp?('−'+fmt(ds.exp)):'0'}</div></div>
      <div class="sbox"><div class="l">合計</div><div class="v ${ds.net>=0?'green':'red'}">${fmtSign(ds.net)}</div></div>
    </div>
    <div class="reclabel"><span>${bookDate} 當日記錄</span><span>${recs.length} 筆</span></div>
    <div class="reclist">${recHtml}</div>`;
}
function cellYmd(y,m,d){ const dt=new Date(y,m,d); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function pickDate(ymd){ bookDate=ymd; renderBook(); }
function calNav(dir){ calMonth+=dir; if(calMonth<0){calMonth=11;calYear--;} if(calMonth>11){calMonth=0;calYear++;} renderBook(); }

// 存款
const TYPE_LABEL={cash:'現金',bank:'銀行',broker:'證券戶',wealth:'理財帳戶',credit:'信用卡',borrow:'借入',lend:'借出'};
function renderBank(){
  const t=totals();
  const all=DB.accounts.filter(a=>String(a.archived)!=='true');
  const depositAccs=all.filter(a=>['cash','bank','lend'].includes(a.type)||!a.type);
  const investAccs =all.filter(a=>['broker','wealth'].includes(a.type));
  const debtAccs   =all.filter(a=>['credit','borrow'].includes(a.type));
  // 環圈（只用存款帳戶）
  let donut='', off=0; const total=t.cash||1;
  const cols=['#c06b54','#d27a62','#e29a82','#a8857a','#8a766e','#6f8a6a'];
  depositAccs.forEach((a,i)=>{ if(String(a.exclude)==='true')return; const pct=(Number(a.balance)||0)/total*100; const dash=Math.max(0,pct)*2.51; donut+=`<circle cx="60" cy="60" r="40" fill="none" stroke="${cols[i%cols.length]}" stroke-width="16" stroke-dasharray="${dash} 251" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off+=dash; });
  const rowHtml=a=>{ const bal=Number(a.balance)||0; return `<div class="lrow" onclick="openEditAccount('${a.account_id}')"><div class="ico">${a.icon||'🏦'}</div>
    <div class="nm">${esc(a.name)}<small>${TYPE_LABEL[a.type]||'未分類'}${(String(a.exclude)==='true')?' · 不計入':''}</small></div>
    <div class="amt ${bal>=0?'green':'red'}">${fmt(bal)}</div></div>`; };
  const depList=depositAccs.map(rowHtml).join('')||'<div class="empty">尚無帳戶</div>';
  const invList=investAccs.length?investAccs.map(rowHtml).join(''):'';
  const debtList=debtAccs.length?debtAccs.map(rowHtml).join(''):'';
  document.getElementById('page-bank').innerHTML=`
    <div class="card"><h3>總存款</h3>
      <div style="text-align:center;padding:8px 0"><div class="big" style="font-size:38px;font-family:Outfit;font-weight:700;color:${t.cash>=0?'var(--green)':'var(--red)'}">$${fmt(t.cash)}</div></div>
    </div>
    <div class="card"><h3>存款帳戶</h3>${depList}</div>
    ${invList?`<div class="card"><h3>投資帳戶 <span style="color:var(--sub);font-weight:500">閒置現金 ${fmt(t.investCash)}</span></h3>${invList}</div>`:''}
    ${debtList?`<div class="card"><h3>信用卡 / 借入（負債）</h3>${debtList}</div>`:''}`;
}

// 投資
let investTab='all';
function renderInvest(){
  const t=totals();
  let hs=DB.holdings.filter(h=>String(h.active)!=='false');
  if(investTab!=='all') hs=hs.filter(h=>h.type===investTab);
  const plPct=t.cost>0?(t.pl/t.cost*100):0;
  let list=hs.sort((a,b)=>(a.sort||0)-(b.sort||0)).map(h=>{
    const up=h.pl>=0;
    return `<div class="lrow" onclick="openEditHolding('${h.holding_id}')"><div class="ico">${h.type==='stock'?'📈':h.type==='etf'?'🧺':'📊'}</div>
      <div class="nm">${esc(h.name)} <small>${esc(h.symbol)} · ${fmt(h.shares)} ${h.type==='fund'?'單位':'股'} · 成本 ${fmt(h.avg_cost)} → 現 ${fmt(h.price)}</small></div>
      <div style="text-align:right"><div class="amt">${fmt(h.marketValue)}</div><div class="amt ${up?'red':'green'}" style="font-size:12px">${up?'+':''}${h.plPct.toFixed(1)}%</div></div></div>`;
  }).join('')||'<div class="empty">尚無持倉，點右上新增</div>';
  document.getElementById('page-invest').innerHTML=`
    <div class="card"><h3>投資總覽 <button class="save" style="font-size:13px" onclick="doRefresh()">↻ 更新現價</button></h3>
      <div style="display:flex;align-items:baseline;gap:10px"><div class="big" style="font-size:30px;font-family:Outfit;font-weight:700;color:${t.invest>=0?'var(--green)':'var(--red)'}">$${fmt(t.invest)}</div>
      <div class="amt ${t.pl>=0?'green':'red'}" style="font-weight:700">未實現 ${t.pl>=0?'+':''}${plPct.toFixed(1)}%</div></div>
      <div class="grid5" style="margin-top:12px"><div class="mbox" style="grid-column:auto"><div class="l">股票</div><div class="v green">${fmt(t.stock)}</div></div>
      <div class="mbox"><div class="l">ETF</div><div class="v green">${fmt(t.etf)}</div></div></div>
      <div class="grid5" style="margin-top:8px"><div class="mbox" style="grid-column:1/3"><div class="l">基金</div><div class="v green">${fmt(t.fund)}</div></div></div>
    </div>
    <div class="segtab">
      <button class="${investTab==='all'?'on':''}" onclick="setInvestTab('all')">全部</button>
      <button class="${investTab==='stock'?'on':''}" onclick="setInvestTab('stock')">股票</button>
      <button class="${investTab==='etf'?'on':''}" onclick="setInvestTab('etf')">ETF</button>
      <button class="${investTab==='fund'?'on':''}" onclick="setInvestTab('fund')">基金</button>
    </div>
    <div class="card">${list}</div>`;
}
function setInvestTab(t){ investTab=t; renderInvest(); }

async function doRefresh(){
  toast('更新現價中…');
  const res=await apiPost('refresh',{});
  if(res.ok){ await loadAll(); toast('已更新'); } else toast('更新失敗');
}

// ---------- 切換分頁 ----------
function switchPage(p){
  curPage=p;
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('on'));
  document.getElementById('page-'+p).classList.add('on');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.page===p));
  const titles={home:'主頁',book:'記帳本',bank:'存款',invest:'投資'};
  document.getElementById('topTitle').textContent=titles[p];
  // 存款/投資頁顯示「新增」chip
  document.getElementById('topAdd').style.display=(p==='bank'||p==='invest')?'flex':'none';
  document.getElementById('app').classList.toggle('bookmode', p==='book');
  document.getElementById('scroll').scrollTop=0;
}
function onTopAdd(){ if(curPage==='bank')openAddAccount(); else if(curPage==='invest')openAddHolding(); }

// ========== 全頁彈窗框架 ==========
function openModal(html){
  const host=document.getElementById('modalHost');
  const div=document.createElement('div');
  div.className='modal'; div.innerHTML=html;
  host.appendChild(div);
  requestAnimationFrame(()=>div.classList.add('show'));
  return div;
}
function closeModal(el){ el.classList.remove('show'); setTimeout(()=>el.remove(),300); }
function closeAllModal(){ document.querySelectorAll('.modal').forEach(m=>closeModal(m)); }

// ========== 記帳表單 ==========
let txnDraft;
function openAddTxn(){
  const dt = (curPage==='book') ? bookDate : todayStr();
  const firstAcc = DB.accounts.filter(a=>String(a.archived)!=='true')[0];
  const firstMem = (DB.members||[]).filter(m=>String(m.archived)!=='true')[0];
  txnDraft={type:'expense',amount:'0',category_id:'',account_id:firstAcc?firstAcc.account_id:'',date:dt,note:'',member_id:firstMem?firstMem.member_id:''};
  renderTxnModal('新增記帳');

function openEditTxn(id){

function dispDate(d){ const x=new Date(dkey(d)); if(isNaN(x))return dkey(d); const wd='日一二三四五六'[x.getDay()]; return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日 週${wd}`; }
function accName(id){ const a=accMap()[id]; return a?(a.icon?a.icon+' ':'')+esc(a.name):'選擇'; }
function memName(id){ const m=(DB.members||[]).find(x=>String(x.member_id)===String(id)); return m?((m.icon||'👤')+' '+esc(m.name)):'選擇'; }
function syncSel(selId){ const map={txnAcc:'txnAccVal',txnToAcc:'txnToAccVal',txnMem:'txnMemVal'}; const valEl=document.getElementById(map[selId]); const sel=document.getElementById(selId); if(valEl&&sel){ const txt=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:''; valEl.innerHTML=esc(txt)+' <span class="ar">›</span>'; } }
function setTxnType(t){
  txnDraft.type=t; txnDraft.category_id='';
  const seg=document.getElementById('txnSeg');
  seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.textContent===(t==='expense'?'支出':t==='income'?'收入':'轉帳')));

  const cp=document.getElementById('catPickTxt'); if(cp){ cp.classList.add('ph'); cp.innerHTML='選擇 <span class="ar">›</span>'; }
  const memR=document.getElementById('txnMemRow'); if(memR) memR.style.display=(t==='transfer')?'none':'flex';
  const accLbl=document.getElementById('txnAccLabel'); if(accLbl) accLbl.textContent=(t==='transfer')?'轉出':'帳戶';

function openCatPicker(){
  const cats=DB.categories.filter(c=>c.type===txnDraft.type&&String(c.archived)!=='true').sort((a,b)=>(a.sort||0)-(b.sort||0));
  const grid=cats.map(c=>`<div class="cbox" onclick="pickCat('${c.category_id}','${c.icon}','${esc(c.name)}')"><div class="e">${c.icon}</div><div class="t">${esc(c.name)}</div></div>`).join('')||'<div class="empty">先到設定新增分類</div>';

function pickCat(id,icon,name){ txnDraft.category_id=id; const el=document.getElementById('catPickTxt'); if(el){ el.classList.remove('ph'); el.innerHTML=esc(name)+' <span class="ar">›</span>'; } const row=document.getElementById('txnCatRow'); if(row){ const ti=row.querySelector('.ti'); if(ti) ti.textContent=icon; } closeTopModal(); }
function closeTopModal(){ const ms=document.querySelectorAll('.modal'); if(ms.length) closeModal(ms[ms.length-1]); if(document.querySelectorAll('.modal').length<=1){} }
function kp(k){ let a=txnDraft.amount; if(k==='c')a='0'; else if(k==='b')a=a.length>1?a.slice(0,-1):'0'; else { a=(a==='0')?k:a+k; } txnDraft.amount=a; document.getElementById('amtDisp').textContent=fmt(a); }
async function saveTxn(edit){
  if(!txnDraft.amount||Number(txnDraft.amount)<=0){ toast('請輸入金額'); return; }
  if(txnDraft.type!=='transfer'&&!txnDraft.category_id){ toast('請選分類'); return; }
  if(txnDraft.type==='transfer'){
    if(!txnDraft.to_account_id) txnDraft.to_account_id=document.getElementById('txnToAcc')?.value||'';
    if(txnDraft.account_id===txnDraft.to_account_id){ toast('轉出轉入不能同一帳戶'); return; }
  }
  const payload={type:txnDraft.type,amount:Number(txnDraft.amount),category_id:txnDraft.category_id,account_id:txnDraft.account_id,to_account_id:txnDraft.to_account_id||'',date:txnDraft.date,note:txnDraft.note,member_id:txnDraft.member_id||''};
  toast('儲存中…');
  let res;
  if(edit){ payload.txn_id=txnDraft.txn_id; res=await apiPost('updateTxn',{payload}); }
  else res=await apiPost('addTxn',{payload});
  if(res.ok){ closeAllModal(); await loadAll(); toast('已儲存'); } else toast('失敗');
}

  accDraft.type=t;

    <div class="nm">${esc(l.name)}<small>利率 ${l.rate}% · 月繳 ${fmt(l.monthlyPayment)} · 剩 ${l.remainingMonths} 期</small></div>
    <div class="amt red">${fmt(l.remainingBalance)}</div></div>`).join('')||'<div class="empty">尚無貸款</div>';
  const m=openModal(`
    <div class="mtop"><button class="x" onclick="closeModal(this.closest('.modal'))">✕</button><div class="t">貸款管理</div><button class="save" onclick="openAddLoan()">＋</button></div>
    <div class="mscroll"><div class="card">${loans}</div></div>`);
}
let loanDraft;
function openAddLoan(){ loanDraft={name:'',principal:'0',rate:'2',term_months:'240',start_date:todayStr(),account_id:DB.accounts[0]?.account_id||'',icon:'🏡'}; renderLoanEdit('新增貸款'); }
function openEditLoan(id){ const l=DB.loans.find(x=>String(x.loan_id)===String(id)); if(!l)return; loanDraft={loan_id:l.loan_id,name:l.name,principal:String(l.principal),rate:String(l.rate),term_months:String(l.term_months),start_date:String(l.start_date).slice(0,10),account_id:l.account_id,icon:l.icon||'🏡'}; renderLoanEdit('編輯貸款',true); }
function renderLoanEdit(title,edit){
  const loanEmos=['🏡','🏠','🚗','💳','💰','🎓','🏢','🛠️','📄','🪙'];
  const m=openModal(`
    <div class="mtop"><button class="x" onclick="closeModal(this.closest('.modal'))">✕</button><div class="t">${title}</div><button class="save" onclick="saveLoan(${edit?true:false})">儲存</button></div>
    <div class="mscroll">
      <div class="field"><label>名稱</label><input class="inp" id="lName" value="${esc(loanDraft.name)}" placeholder="例如：房屋貸款"></div>
      <div class="field"><label>圖示</label><div class="emojigrid" id="lEmo">${loanEmos.map(e=>`<span class="${loanDraft.icon===e?'sel':''}" onclick="loanDraft.icon='${e}';document.querySelectorAll('#lEmo span').forEach(s=>s.classList.remove('sel'));this.classList.add('sel')">${e}</span>`).join('')}</div></div>
      <div class="field"><label>貸款總額 (本金)</label><input class="inp" id="lP" type="number" value="${loanDraft.principal}"></div>
      <div class="field"><label>年利率 (%)</label><input class="inp" id="lR" type="number" step="0.01" value="${loanDraft.rate}"></div>
      <div class="field"><label>期數 (月)</label><input class="inp" id="lN" type="number" value="${loanDraft.term_months}"></div>
      <div class="field"><label>起始日</label><input class="inp" id="lD" type="date" value="${loanDraft.start_date}"></div>
      ${edit?`<button class="bigbtn btn-danger" onclick="delLoan('${loanDraft.loan_id}')">刪除</button>`:''}
    </div>`);
}
async function saveLoan(edit){
  const p={name:document.getElementById('lName').value.trim(),principal:Number(document.getElementById('lP').value)||0,rate:Number(document.getElementById('lR').value)||0,term_months:Number(document.getElementById('lN').value)||0,start_date:document.getElementById('lD').value,icon:loanDraft.icon,extra_payment:0,active:true};
  if(!p.name){ toast('請輸入名稱'); return; }
  let res;
  if(edit){ p.loan_id=loanDraft.loan_id; res=await apiPost('updateLoan',{payload:p}); }
  else res=await apiPost('addLoan',{payload:p});
  if(res.ok){ closeAllModal(); await loadAll(); openLoans(); toast('已儲存'); }
}
async function delLoan(id){ if(!confirm('確定刪除？'))return; const res=await apiPost('deleteLoan',{id}); if(res.ok){ closeAllModal(); await loadAll(); openLoans(); toast('已刪除'); } }

// ========== 週期支出 / 轉帳 ==========
const FREQ_LABEL={monthly:'每月',weekly:'每週',yearly:'每年'};
function openRecurrings(){
  const cm=catMap(), am=accMap();
  const list=(DB.recurring||[]).map(r=>{
    const isT=r.type==='transfer';
    const desc=isT?`${FREQ_LABEL[r.frequency]||r.frequency} · ${esc((am[r.account_id]||{}).name||'')}→${esc((am[r.to_account_id]||{}).name||'')}`
                  :`${FREQ_LABEL[r.frequency]||r.frequency} · ${esc((cm[r.category_id]||{}).name||'')} · 下次 ${String(r.next_date).slice(0,10)}`;
    return `<div class="lrow" onclick="openEditRecurring('${r.recur_id}')"><div class="ico">${isT?'🔄':(cm[r.category_id]||{}).icon||'🔁'}</div>
      <div class="nm">${esc(r.name)}<small>${desc}</small></div>
      <div class="amt ${r.type==='income'?'green':'red'}">${r.type==='income'?'+':r.type==='transfer'?'':'−'}${fmt(r.amount)}</div></div>`;
  }).join('')||'<div class="empty">尚無週期項目</div>';
  openModal(`
    <div class="mtop"><button class="x" onclick="closeModal(this.closest('.modal'))">✕</button><div class="t">週期支出 / 轉帳</div><button class="save" onclick="openAddRecurring()">＋</button></div>
    <div class="mscroll"><div class="card">${list}</div>
      <div style="font-size:12px;color:var(--sub);text-align:center;line-height:1.8">每日 00:15 自動執行到期項目<br>支援每月/每週/每年；轉帳會自動在兩帳戶間移動</div>
    </div>`);
}
let recDraft;
function openAddRecurring(){ recDraft={name:'',type:'expense',account_id:DB.accounts[0]?.account_id||'',to_account_id:'',category_id:'',amount:'0',frequency:'monthly',next_date:todayStr(),active:true}; renderRecEdit('新增週期'); }
function openEditRecurring(id){ const r=(DB.recurring||[]).find(x=>String(x.recur_id)===String(id)); if(!r)return; recDraft={recur_id:r.recur_id,name:r.name,type:r.type,account_id:r.account_id,to_account_id:r.to_account_id||'',category_id:r.category_id,amount:String(r.amount),frequency:r.frequency,next_date:String(r.next_date).slice(0,10),active:r.active}; renderRecEdit('編輯週期',true); }
function renderRecEdit(title,edit){
  const accs=DB.accounts.filter(a=>String(a.archived)!=='true');
  const accOpts=sel=>accs.map(a=>`<option value="${a.account_id}" ${recDraft[sel]===a.account_id?'selected':''}>${esc(a.name)}</option>`).join('');
  const cats=DB.categories.filter(c=>c.type===recDraft.type&&String(c.archived)!=='true');
  const catOpts=cats.map(c=>`<option value="${c.category_id}" ${recDraft.category_id===c.category_id?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('');
  openModal(`
    <div class="mtop"><button class="x" onclick="closeModal(this.closest('.modal'))">✕</button><div class="t">${title}</div><button class="save" onclick="saveRec(${edit?true:false})">儲存</button></div>
    <div class="mscroll">
      <div class="field"><label>類型</label><div class="seg2">
        <button class="${recDraft.type==='expense'?'on':''}" onclick="recSetType('expense')">支出</button>
        <button class="${recDraft.type==='income'?'on':''}" onclick="recSetType('income')">收入</button>
        <button class="${recDraft.type==='transfer'?'on':''}" onclick="recSetType('transfer')">轉帳</button></div></div>
      <div class="field"><label>名稱</label><input class="inp" id="rName" value="${esc(recDraft.name)}" placeholder="例如：定期定額基金 / 房租"></div>
      <div class="field"><label>金額</label><input class="inp" id="rAmt" type="number" value="${recDraft.amount}"></div>
      <div class="field"><label>頻率</label><select class="inp" id="rFreq"><option value="monthly" ${recDraft.frequency==='monthly'?'selected':''}>每月</option><option value="weekly" ${recDraft.frequency==='weekly'?'selected':''}>每週</option><option value="yearly" ${recDraft.frequency==='yearly'?'selected':''}>每年</option></select></div>
      <div class="field"><label>${recDraft.type==='transfer'?'轉出帳戶':'帳戶'}</label><select class="inp" id="rAcc">${accOpts('account_id')}</select></div>
      <div class="field" id="rToField" style="${recDraft.type==='transfer'?'':'display:none'}"><label>轉入帳戶</label><select class="inp" id="rToAcc">${accOpts('to_account_id')}</select></div>
      <div class="field" id="rCatField" style="${recDraft.type==='transfer'?'display:none':''}"><label>分類</label><select class="inp" id="rCat">${catOpts}</select></div>
      <div class="field"><label>下次執行日</label><input class="inp" id="rNext" type="date" value="${recDraft.next_date}"></div>
      ${edit?`<button class="bigbtn btn-danger" onclick="delRec('${recDraft.recur_id}')">刪除</button>`:''}
    </div>`);
}
function recSetType(t){ recDraft.type=t;
  // 同步當前輸入值
  recDraft.name=document.getElementById('rName').value; recDraft.amount=document.getElementById('rAmt').value;
  closeModal(document.querySelectorAll('.modal')[document.querySelectorAll('.modal').length-1]); renderRecEdit(recDraft.recur_id?'編輯週期':'新增週期',!!recDraft.recur_id);
}
async function saveRec(edit){
  const p={name:document.getElementById('rName').value.trim(),type:recDraft.type,amount:Number(document.getElementById('rAmt').value)||0,
    frequency:document.getElementById('rFreq').value,account_id:document.getElementById('rAcc').value,
    to_account_id:recDraft.type==='transfer'?document.getElementById('rToAcc').value:'',
    category_id:recDraft.type==='transfer'?'':document.getElementById('rCat').value,
    next_date:document.getElementById('rNext').value,active:true};
  if(!p.name){ toast('請輸入名稱'); return; }
  if(p.type==='transfer'&&p.account_id===p.to_account_id){ toast('轉出轉入不能同帳戶'); return; }
  let res;
  if(edit){ p.recur_id=recDraft.recur_id; res=await apiPost('updateRecurring',{payload:p}); }
  else res=await apiPost('addRecurring',{payload:p});
  if(res.ok){ closeAllModal(); await loadAll(); openRecurrings(); toast('已儲存'); }
}
async function delRec(id){ if(!confirm('確定刪除？'))return; const res=await apiPost('deleteRecurring',{id}); if(res.ok){ closeAllModal(); await loadAll(); openRecurrings(); toast('已刪除'); } }

// ========== 統計分析 ==========
// 支出：紅粉橘莫蘭迪系
const STAT_EXP_COLORS=['#c97a6d','#d99a8a','#e0b0a0','#cf8f9c','#d4a5b0','#e2b89a','#c98a6a','#bb6a6a','#dba890','#c4848f','#e0a888','#d09a8a'];
// 收入：綠藍黃灰莫蘭迪系
const STAT_INC_COLORS=['#7a9a6e','#8fb89a','#8aa3c4','#9ab0c4','#c4b87a','#d4c88a','#a8b090','#9aab84','#8fb0a8','#b0a884','#90a8b0','#a4b09a'];
function statColors(){ return statTab==='income'?STAT_INC_COLORS:STAT_EXP_COLORS; }
let statYear, statMonth, statTab='expense', statSub='category';
function openStats(){
  const d=new Date(); if(statYear==null){ statYear=d.getFullYear(); statMonth=d.getMonth()+1; }
  openModal(`<div class="mtop"><button class="x" onclick="closeModal(this.closest('.modal'))">✕</button><div class="t">統計分析</div><span style="width:30px"></span></div>
    <div class="mscroll" id="statBody"></div>`);
  renderStats();
}
function statYM(){ return statYear+'-'+String(statMonth).padStart(2,'0'); }
function statNav(dir){ statMonth+=dir; if(statMonth<1){statMonth=12;statYear--;} if(statMonth>12){statMonth=1;statYear++;} renderStats(); }
function setStatTab(t){ statTab=t; if(t!=='trend'&&statSub==='trend')statSub='category'; renderStats(); }
function setStatSub(s){ statSub=s; renderStats(); }

function renderStats(){
  const body=document.getElementById('statBody'); if(!body)return;
  const cm=catMap(), am=accMap();
  const ym=statYM();
  // 篩出當月該類型交易
  const txns=DB.transactions.filter(t=>dkey(t.date).slice(0,7)===ym && t.type===(statTab==='trend'?'expense':statTab));

  let inner='';
  // 年月選擇器
  inner+=`<div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px">
    <button class="kpbtn" onclick="statNav(-1)" style="border:none;background:rgba(58,44,42,.07);width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;color:var(--ink)">‹</button>
    <b style="font-size:17px">${statYear} 年 ${statMonth} 月</b>
    <button class="kpbtn" onclick="statNav(1)" style="border:none;background:rgba(58,44,42,.07);width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;color:var(--ink)">›</button></div>`;

  // 大分頁：支出/收入/趨勢
  inner+=`<div class="segtab">
    <button class="${statTab==='expense'?'on':''}" onclick="setStatTab('expense')">支出</button>
    <button class="${statTab==='income'?'on':''}" onclick="setStatTab('income')">收入</button>
    <button class="${statTab==='trend'?'on':''}" onclick="setStatTab('trend')">趨勢</button></div>`;

  if(statTab==='trend'){
    inner+=renderTrend();
  } else {
    // 小分頁：類別/帳戶/成員
    inner+=`<div class="segtab" style="background:rgba(58,44,42,.04)">
      <button class="${statSub==='category'?'on':''}" onclick="setStatSub('category')">類別比</button>
      <button class="${statSub==='account'?'on':''}" onclick="setStatSub('account')">帳戶比</button>
      <button class="${statSub==='member'?'on':''}" onclick="setStatSub('member')">成員比</button></div>`;
    // 依小分頁分組
    let groups={};
    txns.forEach(t=>{
      let key,label,icon;
      if(statSub==='category'){ const c=cm[t.category_id]||{}; key=t.category_id||'none'; label=c.name||'未分類'; icon=c.icon||'❓'; }
      else if(statSub==='account'){ const a=am[t.account_id]||{}; key=t.account_id||'none'; label=a.name||'未知'; icon=a.icon||'🏦'; }
      else { const mid=t.member_id||'none'; const mm=(DB.members||[]).find(x=>String(x.member_id)===String(mid)); key=mid; label=mm?mm.name:'未指定'; icon=mm?(mm.icon||'👤'):'👤'; }
      if(!groups[key]) groups[key]={label,icon,amt:0};
      groups[key].amt+=Number(t.amount)||0;
    });
    const arr=Object.values(groups).sort((a,b)=>b.amt-a.amt);
    const total=arr.reduce((s,g)=>s+g.amt,0);
    const cols=statColors();
    inner+=`<div class="card">${donutChart(arr,total)}${arr.length?arr.map((g,i)=>{
      const pct=total>0?(g.amt/total*100):0;
      return `<div class="lrow"><div class="ico" style="background:${cols[i%cols.length]}22;border-color:${cols[i%cols.length]}">${g.icon}</div><div class="nm">${esc(g.label)}<small>${pct.toFixed(1)}%</small></div><div class="amt ${statTab==='income'?'green':'red'}">${fmt(g.amt)}</div></div>`;
    }).join(''):'<div class="empty">本月無資料</div>'}</div>`;
  }
  body.innerHTML=inner;
}

function donutChart(arr,total){
  if(!total) return '<div class="empty">本月無資料</div>';
  const cols=statColors();
  let off=0, segs='';
  arr.forEach((g,i)=>{ const pct=g.amt/total; const dash=pct*314; segs+=`<circle cx="60" cy="60" r="50" fill="none" stroke="${cols[i%cols.length]}" stroke-width="18" stroke-dasharray="${dash} ${314-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off+=dash; });
  // 小圖例（最多顯示前 6 項）
  const legend=arr.slice(0,6).map((g,i)=>{ const pct=total>0?(g.amt/total*100):0; return `<div style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;margin-bottom:5px"><span style="width:10px;height:10px;border-radius:3px;background:${cols[i%cols.length]};flex-shrink:0"></span><span style="flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.label)}</span><span style="color:var(--sub)">${pct.toFixed(0)}%</span></div>`; }).join('');
  return `<div style="display:flex;align-items:center;gap:14px;padding:6px 0 14px">
    <svg viewBox="0 0 120 120" style="width:130px;height:130px;flex-shrink:0">${segs}<circle cx="60" cy="60" r="40" fill="var(--bg)"/><text x="60" y="56" text-anchor="middle" font-size="9" fill="var(--sub)">總計</text><text x="60" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)" font-family="Outfit">${fmt(total)}</text></svg>
    <div style="flex:1;min-width:0">${legend}</div>
  </div>`;
}

function renderTrend(){
  const months=[];
  let y=statYear, mo=statMonth;
  for(let i=5;i>=0;i--){ let yy=y, mm=mo-i; while(mm<1){mm+=12;yy--;} months.push(yy+'-'+String(mm).padStart(2,'0')); }
  const data=months.map(ym=>{ const mt=monthTotals(ym); return {ym,inc:mt.inc,exp:mt.exp,net:mt.inc-mt.exp}; });
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  // 折線：淨收支，範圍含負值
  const nets=data.map(d=>d.net);
  const nmax=Math.max(1,...nets), nmin=Math.min(0,...nets), nrng=(nmax-nmin)||1;
  const H=150, W=320, n=data.length, LEFT=40;
  const px=i=>LEFT+(n>1?(i/(n-1)):0.5)*(W-LEFT-16);
  const py=v=>H-8-((v-nmin)/nrng*(H-24));
  const linePts=nets.map((v,i)=>`${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
  const dots=nets.map((v,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="4" fill="var(--ink)"/>`).join('');
  // Y 軸刻度（依 max 分 4 段，取整到漂亮數字）
  function niceNum(x){ if(x<=0)return 0; const e=Math.pow(10,Math.floor(Math.log10(x))); const f=x/e; const nf=f<1.5?1:f<3?2:f<7?5:10; return nf*e; }
  const step=niceNum(max/4)||1; const top=Math.ceil(max/step)*step;
  let yaxis=''; let grid='';
  for(let v=0; v<=top+0.5; v+=step){
    const yy=(H-8-(v/max*(H-24))).toFixed(1);
    const lbl=v>=10000?(v/10000)+'萬':v>=1000?(v/1000)+'K':v;
    yaxis+=`<text x="${LEFT-5}" y="${(+yy+3).toFixed(1)}" text-anchor="end" font-size="8" fill="#a8968e" font-family="Outfit">${lbl}</text>`;
    grid+=`<line x1="${LEFT}" y1="${yy}" x2="${W-4}" y2="${yy}" stroke="rgba(58,44,42,.07)" stroke-width="1"/>`;
  }
  // 長條
  const bw=(W-LEFT-16)/n*0.42;
  const bars=data.map((d,i)=>{
    const cx=px(i);
    const ih=d.inc/max*(H-24), eh=d.exp/max*(H-24);
    return `<rect x="${(cx-bw-1).toFixed(1)}" y="${(H-8-ih).toFixed(1)}" width="${bw.toFixed(1)}" height="${ih.toFixed(1)}" rx="2" fill="#8fb89a"/>
            <rect x="${(cx+1).toFixed(1)}" y="${(H-8-eh).toFixed(1)}" width="${bw.toFixed(1)}" height="${eh.toFixed(1)}" rx="2" fill="#d4897a"/>`;
  }).join('');
  const labels=data.map((d,i)=>`<text x="${px(i).toFixed(1)}" y="${H+12}" text-anchor="middle" font-size="9" fill="#8a766e" font-weight="700">${d.ym.slice(5)}月</text>`).join('');

  // 累計總收支
  let cum=0; const cumData=data.map(d=>{ cum+=d.net; return cum; });

  return `<div class="card"><h3>近 6 個月收支趨勢</h3>
    <svg viewBox="0 0 ${W} ${H+20}" style="width:100%">
      ${grid}${yaxis}
      ${bars}
      <polyline points="${linePts}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
      ${labels}
    </svg>
    <div style="display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:12px;font-weight:700;flex-wrap:wrap">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#8fb89a;margin-right:4px"></span>收入</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#d4897a;margin-right:4px"></span>支出</span>
      <span><span style="display:inline-block;width:14px;height:3px;background:#3a2c2a;margin-right:4px;vertical-align:middle"></span>淨收支</span></div></div>
    <div class="card"><h3>每月明細</h3>
      ${data.slice().reverse().map((d,idx)=>{
        const totalCum=cumData[data.length-1-idx];
        return `<div style="padding:12px 0;border-bottom:1px solid var(--line)">
          <div style="font-weight:700;font-size:15px;margin-bottom:6px">${d.ym}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;font-weight:700">
            <div style="color:var(--sub)">收入 <span class="green">+${fmt(d.inc)}</span></div>
            <div style="color:var(--sub)">支出 <span class="red">−${fmt(d.exp)}</span></div>
            <div style="color:var(--sub)">本月收支 <span class="${d.net>=0?'green':'red'}">${fmtSign(d.net)}</span></div>
            <div style="color:var(--sub)">累計總收支 <span class="${totalCum>=0?'green':'red'}">${fmtSign(totalCum)}</span></div>
          </div></div>`;
      }).join('')}
    </div>`;
}
