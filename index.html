<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6efec">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="查理的記帳APP">
<title>查理的記帳APP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'GenSenRound';src:url('https://cdn.jsdelivr.net/gh/max32002/GenSenRounded-webfont@1.0/webfont/GenSenRounded-TC/GenSenRoundedTC-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'GenSenRound';src:url('https://cdn.jsdelivr.net/gh/max32002/GenSenRounded-webfont@1.0/webfont/GenSenRounded-TC/GenSenRoundedTC-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{
  --bg:#f6efec; --ink:#3a2c2a; --sub:#8a766e; --line:rgba(58,44,42,.08);
  --coral:#c06b54; --coral2:#d27a62; --coral3:#e29a82;
  --green:#6f8a6a; --red:#c06b54;
  --card:rgba(255,255,255,.7); --cardgrad:linear-gradient(160deg,#fdf8f6 0%,#f4ebe7 100%);
  --herograd:linear-gradient(150deg,#43332e 0%,#2e211d 60%,#3a2a25 100%);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;overflow-x:hidden}
input,select,textarea{max-width:100%}
body{font-family:'GenSenRound','Outfit',sans-serif;background:var(--bg);color:var(--ink);
  display:flex;justify-content:center}
.num,.amt{font-family:'Outfit',sans-serif}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}

/* 固定頂列 */
.topbar{flex-shrink:0;padding:max(14px,env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);z-index:5}
.topbar .title{font-size:22px;font-weight:700}
.topbar .gear,.topbar .back{width:38px;height:38px;border-radius:12px;background:rgba(58,44,42,.07);display:flex;align-items:center;justify-content:center;cursor:pointer}
.topbar .gear svg,.topbar .back svg{width:20px;height:20px;stroke:var(--ink)}
.topbar .addchip{display:flex;align-items:center;gap:5px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:8px 14px;border-radius:20px;cursor:pointer}
.topbar .addchip svg{width:15px;height:15px;stroke:var(--bg)}

/* 中間捲動區 */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 18px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}

/* 固定底部 Tab */
.tabbar{flex-shrink:0;display:flex;justify-content:space-around;align-items:center;padding:10px 8px max(22px,env(safe-area-inset-bottom));background:var(--bg);border-top:1.5px solid var(--ink)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;opacity:.34;cursor:pointer;border:none;background:none;color:var(--ink);font-family:inherit}
.tab.on{opacity:1;color:var(--coral)}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none}
.addbtn{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--coral3),var(--coral2));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(210,122,98,.4);margin-top:-20px;cursor:pointer;border:none}
.addbtn svg{width:26px;height:26px;stroke:#fff;fill:none}

/* 卡片 */
.card{background:var(--cardgrad);box-shadow:0 4px 18px rgba(58,44,42,.06),inset 0 1px 0 #fff;border:1px solid rgba(58,44,42,.05);border-radius:20px;padding:18px;margin-bottom:13px}
.card h3{font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--sub);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}

/* 淨資產主卡 */
.hero{background:var(--herograd);color:#f4e9e4;border-radius:26px;padding:24px 22px;margin-bottom:14px;box-shadow:0 14px 34px rgba(58,44,42,.26),inset 0 1px 0 rgba(255,255,255,.07);position:relative;overflow:hidden}
.hero .label{font-size:13px;font-weight:700;letter-spacing:.5px;color:#b09a92}
.hero .big{font-size:44px;font-weight:700;letter-spacing:-1px;margin-top:8px;line-height:1.05;color:#f0b8a6;font-family:'Outfit'}
.hero .sub{display:flex;gap:12px;margin-top:14px;font-size:12px;font-weight:700}
.hero .sub span{padding:5px 11px;border-radius:20px}
.hero .sub .up{background:linear-gradient(135deg,var(--coral3),var(--coral2));color:#2e1c18}
.hero .sub .loan{background:rgba(255,255,255,.1);color:#d9c4bd}
.trend{height:64px;margin-top:14px;position:relative}
.trend svg{width:100%;height:100%}

/* 5 格 */
.grid5{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbox{background:rgba(58,44,42,.05);border-radius:13px;padding:11px 12px;cursor:pointer}
.mbox:first-child{grid-column:1/3;background:linear-gradient(135deg,rgba(210,122,98,.13),rgba(210,122,98,.04))}
.mbox .l{font-size:12px;color:var(--sub);font-weight:700}
.mbox .v{font-size:20px;font-family:'Outfit';font-weight:700;margin-top:3px;color:var(--coral)}

/* 列表通用 */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border:none}
.lrow .ico{width:42px;height:42px;border-radius:12px;background:linear-gradient(150deg,#f3e6e1,#ebd9d2);box-shadow:inset 0 1px 0 #fff;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.lrow .nm{flex:1;font-weight:700;font-size:15px}
.lrow .nm small{display:block;font-size:11px;color:var(--sub);font-weight:500;margin-top:1px}
.lrow .amt{font-weight:700;font-size:16px;font-family:'Outfit'}
.green{color:var(--green)}.red{color:var(--red)}
.bar{height:7px;border-radius:6px;background:#ecdcd6;overflow:hidden;margin:7px 0 3px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--coral2),var(--coral3))}

/* 記帳本 */
.calwrap{margin-bottom:11px}
.calhead{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700;margin-bottom:10px}
.calhead button{border:none;background:rgba(58,44,42,.07);width:32px;height:32px;border-radius:9px;font-size:16px;cursor:pointer;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{font-size:10px;color:var(--sub);text-align:center;padding:3px 0;font-weight:700}
.cal .d{aspect-ratio:1;background:rgba(58,44,42,.04);border-radius:8px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);position:relative;cursor:pointer;font-family:'Outfit';font-weight:600}
.cal .d.mute{opacity:.28}
.cal .d.today{outline:2px solid var(--coral3)}
.cal .d.act{background:var(--coral);color:#fff}
.cal .d.dot::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--coral2);position:absolute;bottom:5px}
.cal .d.act.dot::after{background:#fff}
.summary{display:flex;gap:8px;margin-bottom:11px}
.sbox{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.sbox .l{font-size:11px;color:var(--sub);font-weight:700}
.sbox .v{font-size:17px;font-family:'Outfit';font-weight:700;margin-top:3px}
.reclabel{font-size:12px;color:var(--sub);font-weight:700;margin:2px 2px 8px;display:flex;justify-content:space-between}
.reclist{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px;min-height:120px}
/* 記帳本：整頁不捲，記錄區填滿剩餘高度並內部捲動（拉感） */
#app.bookmode .scroll{overflow:hidden;display:flex;flex-direction:column}
#app.bookmode #page-book{display:flex;flex-direction:column;flex:1;min-height:0}
#app.bookmode #page-book .reclist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* 分頁籤 */
.segtab{display:flex;background:rgba(58,44,42,.07);border-radius:12px;padding:3px;margin-bottom:13px}
.segtab button{flex:1;border:none;background:none;font-family:inherit;font-size:14px;font-weight:700;padding:9px;border-radius:9px;color:var(--sub);cursor:pointer}
.segtab button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* 設定列 */
.setrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px;font-size:15px;font-weight:700;cursor:pointer}
.setrow .e{font-size:19px}.setrow .ar{margin-left:auto;color:#b0a09a;font-size:18px}

/* 全頁彈窗 */
.modal{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;opacity:0;transition:opacity .15s ease;visibility:hidden}
.modal.show{opacity:1;visibility:visible}
.mtop{flex-shrink:0;padding:max(16px,env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between}
.mtop .x{font-size:24px;color:#b0a09a;cursor:pointer;background:none;border:none;width:30px}
.mtop .t{font-size:18px;font-weight:700}
.mtop .save{font-size:15px;font-weight:700;color:var(--coral);cursor:pointer;background:none;border:none;font-family:inherit}
.mscroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 18px 30px;scrollbar-width:none}
.mscroll::-webkit-scrollbar{display:none}
.field{margin-bottom:16px}
.field label{font-size:13px;font-weight:700;color:var(--sub);display:block;margin-bottom:7px}
.inp{width:100%;background:rgba(255,255,255,.85);border:1.5px solid rgba(58,44,42,.15);border-radius:12px;padding:13px 14px;font-size:15px;font-family:inherit;font-weight:700;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--coral3)}
select.inp{appearance:none}
.seg2{display:flex;background:rgba(58,44,42,.07);border-radius:11px;padding:3px}
.seg2 button{flex:1;border:none;background:none;font-family:inherit;font-size:14px;font-weight:700;padding:10px;border-radius:9px;color:var(--sub);cursor:pointer}
.seg2 button.on{background:#fff;color:var(--ink)}
.emojigrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.emojigrid span{aspect-ratio:1;background:rgba(255,255,255,.7);border:1.5px solid transparent;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.emojigrid span.sel{border-color:var(--coral);background:#fbeae4}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;position:relative}
.cbox .e{font-size:25px}.cbox .t{font-size:12px;font-weight:700;text-align:center}
.cbox.add{background:linear-gradient(135deg,var(--coral3),var(--coral2));border:none;color:#fff}
.bigbtn{width:100%;background:var(--ink);color:var(--bg);border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:6px}
.btn-danger{background:none;color:var(--red);border:1.5px solid var(--red);margin-top:10px}

/* keypad */
.txnbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 18px 14px;scrollbar-width:none}
.txnbody::-webkit-scrollbar{display:none}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 18px max(18px,env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);flex-shrink:0}
.kp button{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;font-size:21px;font-weight:700;font-family:'Outfit';cursor:pointer;color:var(--ink)}
.amtdisplay{font-size:42px;font-family:'Outfit';font-weight:700;text-align:right;padding:6px 4px 14px;color:var(--coral)}
.picker{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.85);border:1.5px solid rgba(58,44,42,.15);border-radius:12px;padding:13px 14px;font-size:15px;font-weight:700;cursor:pointer}
.picker .ar{color:#b0a09a;font-size:18px}

/* loading / toast */
.loading{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:99}
.spinner{width:38px;height:38px;border:3px solid rgba(192,107,84,.2);border-top-color:var(--coral);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:22px;font-size:14px;font-weight:700;z-index:90;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:30px 0}
.page{display:none}.page.on{display:block}
.donut{width:120px;height:120px;margin:0 auto}
/* 啟動畫面 splash（像微信進入） */
#splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#c0392b 0%,#a02718 60%,#7d1c10 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease;gap:22px}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo{width:128px;height:128px;border-radius:30px;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:splashpop .6s cubic-bezier(.34,1.4,.5,1)}
#splash .title{color:#f8e8c8;font-size:24px;font-weight:700;letter-spacing:2px;animation:splashfade .8s ease .2s both}
#splash .foot{position:absolute;bottom:max(46px,env(safe-area-inset-bottom));color:rgba(248,232,200,.6);font-size:13px;font-weight:500;animation:splashfade .8s ease .4s both}
@keyframes splashpop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes splashfade{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loading"><div class="spinner"></div><div style="color:var(--sub);font-size:13px;font-weight:700">載入中…</div></div>

  <!-- 頂列 -->
  <div class="topbar">
    <div class="back" id="topBack" style="display:none" onclick="closeAllModal()"><svg viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round" fill="none"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="title" id="topTitle">主頁</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="addchip" id="topAdd" style="display:none" onclick="onTopAdd()"><svg viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round" fill="none"><path d="M12 5v14M5 12h14"/></svg>新增</div>
      <div class="gear" onclick="openSettings()"><svg viewBox="0 0 24 24" stroke-width="2" fill="none"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg></div>
    </div>
  </div>

  <!-- 內容 -->
  <div class="scroll" id="scroll">
    <!-- 主頁 -->
    <div class="page on" id="page-home"></div>
    <!-- 記帳本 -->
    <div class="page" id="page-book"></div>
    <!-- 存款 -->
    <div class="page" id="page-bank"></div>
    <!-- 投資 -->
    <div class="page" id="page-invest"></div>
  </div>

  <!-- 底部 Tab -->
  <div class="tabbar">
    <button class="tab on" data-page="home" onclick="switchPage('home')"><svg viewBox="0 0 24 24" stroke-width="2.2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>主頁</button>
    <button class="tab" data-page="book" onclick="switchPage('book')"><svg viewBox="0 0 24 24" stroke-width="2.2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM9 3v16"/></svg>記帳本</button>
    <button class="addbtn" onclick="openAddTxn()"><svg viewBox="0 0 24 24" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-page="bank" onclick="switchPage('bank')"><svg viewBox="0 0 24 24" stroke-width="2.2"><path d="M3 9l9-6 9 6M4 9v10h16V9M9 19v-6h6v6"/></svg>存款</button>
    <button class="tab" data-page="invest" onclick="switchPage('invest')"><svg viewBox="0 0 24 24" stroke-width="2.2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>投資</button>
  </div>

  <!-- 各種全頁彈窗掛這 -->
  <div id="modalHost"></div>
  <div class="toast" id="toast"></div>
</div>

<div id="splash">
  <img class="logo" src="icon-192.png" alt="">
  <div class="title">查理的記帳APP</div>
  <div class="foot">財神保佑・記帳理財</div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzishhFaJF9zQHkxt35VEZ9fahfDkOxa6TX2EcYuk0iaKzqyRzIaMyo9cPdNWCa9ET8Fg/exec';

let DB = null;             // 全部資料
let curPage = 'home';
let bookDate = todayStr(); // 記帳本選定日期
let calYear, calMonth;     // 月曆顯示年月

// ---------- 工具 ----------
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dkey(v){ // 把任何日期字串正規化成 yyyy-MM-dd
  let s=String(v||'').trim();
  let m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  return s.slice(0,10);
}
function fmt(n){ n=Number(n)||0; return n.toLocaleString('en-US',{maximumFractionDigits:0}); }
function fmtSign(n){ n=Number(n)||0; return (n>=0?'+':'')+fmt(n); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- API ----------
async function apiGet(action){
  const r = await fetch(API_URL+'?action='+action);
  return await r.json();
}
let _posting = false;
async function apiPost(action, extra){
  if(_posting){ return {ok:false, error:'busy'}; } // 防連點/重送
  _posting = true;
  try{
    const r = await fetch(API_URL, {
      method:'POST',
      redirect:'follow',
      body: JSON.stringify(Object.assign({action}, extra)),
      headers:{'Content-Type':'text/plain;charset=utf-8'} // 避免 CORS preflight
    });
    return await r.json();
  } finally {
    _posting = false;
  }
}

async function loadAll(){
  const res = await apiGet('all');
  if(res.ok){ DB = res.data; renderAll(); }
  else { toast('載入失敗'); console.error(res.error); }
  document.getElementById('loading').style.display='none';
}

// ---------- emoji 庫（70+） ----------
const EMOJIS = ['🍽️','🍜','🍱','🍔','🍕','🍰','🍹','☕','🛒','🛍️','👕','👟','💄','🧴','🚆','🚗','🚕','⛽','✈️','🚲','🅿️','🏠','🏡','🏘️','💡','📺','🛋️','🔧','📱','💻','📞','📶','🎮','🎬','🎤','💊','🦷','🏥','💉','🧘','💆','🏆','📖','🎓','📚','✏️','💼','📄','⚖️','💰','💵','💸','💳','🏦','🪙','📈','🎁','🧧','🎉','🐶','🐱','🌳','🌸','🍑','🚬','💎','👶','🎵','⭐','☂️','⚽'];

// ---------- 計算 ----------
function totals(){
  let cash=0, investCash=0, accLoan=0;
  DB.accounts.forEach(a=>{
    if(String(a.archived)==='true'||a.archived===true) return;
    if(String(a.exclude)==='true'||a.exclude===true) return;
    const bal=Number(a.balance)||0, ty=a.type;
    if(ty==='cash'||ty==='bank') cash+=bal;
    else if(ty==='broker'||ty==='wealth') investCash+=bal;
    else if(ty==='credit'||ty==='borrow') accLoan+=Math.abs(bal);
    else if(ty==='lend') cash+=bal;
    else cash+=bal;
  });
  let stock=0,etf=0,fund=0,cost=0;
  DB.holdings.forEach(h=>{ if(h.type==='stock')stock+=h.marketValue; else if(h.type==='etf')etf+=h.marketValue; else if(h.type==='fund')fund+=h.marketValue; cost+=h.costValue; });
  let loan=accLoan; DB.loans.forEach(l=>{ if(String(l.active)!=='false') loan+=Number(l.remainingBalance)||0; });
  const holdingValue=stock+etf+fund;
  const invest=holdingValue+investCash;   // 投資含證券/理財閒置現金
  return {cash,investCash,stock,etf,fund,invest,holdingValue,cost,loan,assets:cash+invest,pl:holdingValue-cost};
}
function monthTotals(ym){ // ym='2026-06'
  let inc=0,exp=0;
  DB.transactions.forEach(t=>{ if(dkey(t.date).slice(0,7)===ym){ if(t.type==='income')inc+=Number(t.amount)||0; else if(t.type==='expense')exp+=Number(t.amount)||0; } });
  return {inc,exp,net:inc-exp};
}
function dayTotals(d){
  let inc=0,exp=0;
  DB.transactions.forEach(t=>{ if(dkey(t.date)===d){ if(t.type==='income')inc+=Number(t.amount)||0; else if(t.type==='expense')exp+=Number(t.amount)||0; } });
  return {inc,exp,net:inc-exp};
}
function catMap(){ const m={}; DB.categories.forEach(c=>m[c.category_id]=c); return m; }
function accMap(){ const m={}; DB.accounts.forEach(a=>m[a.account_id]=a); return m; }

// 記帳本
function renderBook(){
  const cm=catMap();
  const d=new Date(bookDate); if(calYear==null){ calYear=d.getFullYear(); calMonth=d.getMonth(); }
  const ds=dayTotals(bookDate);
  // 月曆
  const first=new Date(calYear,calMonth,1); const startW=first.getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const recDates={}; DB.transactions.forEach(t=>{ recDates[dkey(t.date)]=true; });
  let cells='';
  for(let i=0;i<42;i++){
    let dd,cls='d',ymd;
    if(i<startW){ dd=prevDays-startW+1+i; cls+=' mute'; const m=calMonth-1; ymd=cellYmd(calYear,m,dd); }
    else if(i<startW+daysInMonth){ dd=i-startW+1; ymd=cellYmd(calYear,calMonth,dd);
      if(ymd===todayStr())cls+=' today'; if(ymd===bookDate)cls+=' act'; if(recDates[ymd])cls+=' dot'; }
    else { dd=i-startW-daysInMonth+1; cls+=' mute'; ymd=cellYmd(calYear,calMonth+1,dd); }
    cells+=`<div class="${cls}" onclick="pickDate('${ymd}')">${dd}</div>`;
    if(i>=startW+daysInMonth && (i-startW-daysInMonth+1)>=7 && i%7===6) {} // 不提早結束，固定 6 列
  }
  // 當日記錄
  const recs=DB.transactions.filter(t=>dkey(t.date)===bookDate).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  let recHtml=recs.map(t=>{
    const c=cm[t.category_id]||{}; const isInc=t.type==='income';
    return `<div class="lrow" onclick="openEditTxn('${t.txn_id}')"><div class="ico">${c.icon||(isInc?'💰':'💸')}</div>
      <div class="nm">${esc(c.name||t.note||'未分類')}<small>${esc(t.note||'')}</small></div>
      <div class="amt ${isInc?'green':'red'}">${isInc?'+':'−'}${fmt(t.amount)}</div></div>`;
  }).join('') || '<div class="empty">這天還沒有記錄</div>';

  document.getElementById('page-book').innerHTML=`
    <div class="card calwrap">
      <div class="calhead"><button onclick="calNav(-1)">‹</button><span>${calYear} 年 ${calMonth+1} 月</span><button onclick="calNav(1)">›</button></div>
      <div class="cal">
        <div class="h">日</div><div class="h">一</div><div class="h">二</div><div class="h">三</div><div class="h">四</div><div class="h">五</div><div class="h">六</div>
        ${cells}
      </div>
    </div>
    <div class="summary">
      <div class="sbox"><div class="l">收入</div><div class="v green">${fmtSign(ds.inc)}</div></div>
      <div class="sbox"><div class="l">支出</div><div class="v red">${ds.exp?('−'+fmt(ds.exp)):'0'}</div></div>
      <div class="sbox"><div class="l">合計</div><div class="v ${ds.net>=0?'green':'red'}">${fmtSign(ds.net)}</div></div>
    </div>
    <div class="reclabel"><span>${bookDate} 當日記錄</span><span>${recs.length} 筆</span></div>
    <div class="reclist">${recHtml}</div>`;
}
function cellYmd(y,m,d){ const dt=new Date(y,m,d); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }

function calNav(dir){ calMonth+=dir; if(calMonth<0){calMonth=11;calYear--;} if(calMonth>11){calMonth=0;calYear++;} renderBook(); }

      <div class="field" id="rCatField" style="${recDraft.type==='transfer'?'display:none':''}"><label>分類</label><select class="inp" id="rCat">${catOpts}</select></div>
      <div class="field"><label>下次執行日</label><input class="inp" id="rNext" type="date" value="${recDraft.next_date}"></div>
      ${edit?`<button class="bigbtn btn-danger" onclick="delRec('${recDraft.recur_id}')">刪除</button>`:''}
    </div>`);
  document.getElementById('topBack').style.display='flex';
}
function recSetType(t){ recDraft.type=t;
  // 同步當前輸入值
  recDraft.name=document.getElementById('rName').value; recDraft.amount=document.getElementById('rAmt').value;
  closeModal(document.querySelectorAll('.modal')[document.querySelectorAll('.modal').length-1]); renderRecEdit(recDraft.recur_id?'編輯週期':'新增週期',!!recDraft.recur_id);
}
async function saveRec(edit){
  const p={name:document.getElementById('rName').value.trim(),type:recDraft.type,amount:Number(document.getElementById('rAmt').value)||0,
    frequency:document.getElementById('rFreq').value,account_id:document.getElementById('rAcc').value,
    to_account_id:recDraft.type==='transfer'?document.getElementById('rToAcc').value:'',
    category_id:recDraft.type==='transfer'?'':document.getElementById('rCat').value,
    next_date:document.getElementById('rNext').value,active:true};
  if(!p.name){ toast('請輸入名稱'); return; }
  if(p.type==='transfer'&&p.account_id===p.to_account_id){ toast('轉出轉入不能同帳戶'); return; }
  let res;
  if(edit){ p.recur_id=recDraft.recur_id; res=await apiPost('updateRecurring',{payload:p}); }
  else res=await apiPost('addRecurring',{payload:p});
  if(res.ok){ closeAllModal(); await loadAll(); openRecurrings(); toast('已儲存'); }
}
async function delRec(id){ if(!confirm('確定刪除？'))return; const res=await apiPost('deleteRecurring',{id}); if(res.ok){ closeAllModal(); await loadAll(); openRecurrings(); toast('已刪除'); } }

// ========== 成員管理 ==========
function openMembers(){
  const list=(DB.members||[]).filter(m=>String(m.archived)!=='true').map(m=>`<div class="lrow" onclick="openEditMember('${m.member_id}')"><div class="ico">${m.icon||'👤'}</div><div class="nm">${esc(m.name)}</div><span class="ar" style="color:#b0a09a">✎</span></div>`).join('')||'<div class="empty">尚無成員</div>';
  openModal(`
    <div class="mtop"><button class="x" onclick="closeModal(this.closest('.modal'))">✕</button><div class="t">成員管理</div><button class="save" onclick="openAddMember()">＋</button></div>
    <div class="mscroll"><div class="card">${list}</div>
      <div style="font-size:12px;color:var(--sub);text-align:center;line-height:1.8">記帳時可指定花費歸屬於哪位成員</div></div>`);
  document.getElementById('topBack').style.display='flex';
}
let memDraft;
const MEMBER_EMOJIS=['👤','👨','👩','🧑','👦','👧','👴','👵','🧒','👶','🐶','🐱','💑','👨‍👩‍👧','🙋','🧔'];
function openAddMember(){ memDraft={name:'',icon:'👤'}; renderMemEdit('新增成員'); }
function openEditMember(id){ const m=(DB.members||[]).find(x=>String(x.member_id)===String(id)); if(!m)return; memDraft={member_id:m.member_id,name:m.name,icon:m.icon||'👤'}; renderMemEdit('編輯成員',true); }
function renderMemEdit(title,edit){
  openModal(`
    <div class="mtop"><button class="x" onclick="closeModal(this.closest('.modal'))">✕</button><div class="t">${title}</div><button class="save" onclick="saveMem(${edit?true:false})">儲存</button></div>
    <div class="mscroll">
      <div class="field"><label>名稱</label><input class="inp" id="memName" value="${esc(memDraft.name)}" placeholder="例如：老婆、小孩、自己"></div>
      <div class="field"><label>圖示</label><div class="emojigrid" id="memEmo">${MEMBER_EMOJIS.map(e=>`<span class="${memDraft.icon===e?'sel':''}" onclick="memDraft.icon='${e}';document.querySelectorAll('#memEmo span').forEach(s=>s.classList.remove('sel'));this.classList.add('sel')">${e}</span>`).join('')}</div></div>
      ${edit?`<button class="bigbtn btn-danger" onclick="delMem('${memDraft.member_id}')">刪除</button>`:''}
    </div>`);
  document.getElementById('topBack').style.display='flex';
}
async function saveMem(edit){
  memDraft.name=document.getElementById('memName').value.trim();
  if(!memDraft.name){ toast('請輸入名稱'); return; }
  let res;
  if(edit){ res=await apiPost('updateMember',{payload:{member_id:memDraft.member_id,name:memDraft.name,icon:memDraft.icon,archived:false}}); }
  else res=await apiPost('addMember',{payload:{name:memDraft.name,icon:memDraft.icon,archived:false}});
  if(res.ok){ closeAllModal(); await loadAll(); openMembers(); toast('已儲存'); }
}
async function delMem(id){ if(!confirm('確定刪除？'))return; const res=await apiPost('deleteMember',{id}); if(res.ok){ closeAllModal(); await loadAll(); openMembers(); toast('已刪除'); } }

// ---------- 啟動 ----------
const splashStart = Date.now();
function hideSplash(){ const sp=document.getElementById('splash'); if(sp){ sp.classList.add('hide'); setTimeout(()=>sp.remove(),500); } }
loadAll().then(()=>{
  const wait = Math.max(0, 1500 - (Date.now()-splashStart));
  setTimeout(hideSplash, wait);
});
setTimeout(hideSplash, 4500); // 保險：最長 4.5 秒一定淡出
</script>
</body>
</html>
